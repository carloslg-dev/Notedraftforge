name: Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Tests (React / Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ndf-react/package-lock.json
      - name: Install dependencies
        working-directory: ndf-react
        run: npm ci
      - name: Lint
        working-directory: ndf-react
        run: npm run lint
      - name: Run Vitest Suite
        working-directory: ndf-react
        run: npm test

  test-backend:
    name: Backend Tests (Quarkus / Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'
      - name: Build & Test with Maven
        working-directory: ndf-backend
        run: mvn clean test
